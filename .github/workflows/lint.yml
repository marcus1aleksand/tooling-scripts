# Lint and test the shell scripts in this repo.
#
# NOTE: the BATS suite in test_tooling_setup.bats is designed for local machine
# testing (it checks Homebrew, iTerm2 and the local ~/.zshrc), so it is skipped
# in CI where those tools are not installed. Run it locally with:
#   bats test_tooling_setup.bats
name: Lint

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          severity: warning

  shfmt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run shfmt
        uses: luizm/action-sh-checker@v0.10.0
        env:
          SHFMT_OPTS: -i 2 -ci
        with:
          sh_checker_shellcheck_disable: true
          sh_checker_shfmt_disable: false

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run selection mapping regression tests
        run: bash tests/test_selection_mapping.sh
